<text x="930" y="899" font-size="14" fill="#fff" font-weight="normal" text-anchor="middle" >Sensor</text>
<text x="865" y="769" font-size="17" fill="#d32f2f" font-weight="bold" text-anchor="end" >RED → terminal 1 (+24 V)</text>
<text x="947" y="769" font-size="17" fill="#111" font-weight="bold" text-anchor="start" >BLACK → terminal 2 (signal)</text>
<text x="951" y="810" font-size="14" fill="#555" font-weight="normal" text-anchor="start" >(wires enter the terminal from below)</text>
<rect x="21" y="380" width="241" height="299" rx="9" fill="#f9fafb" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="34" y="408" font-size="17" fill="#1d4ed8" font-weight="bold" text-anchor="start" >LOLIN C3 mini</text>
<text x="34" y="436.0" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >Plugs into J3 + J4</text>
<text x="34" y="460.2" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >• Chip/antenna facing up</text>
<text x="34" y="484.4" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >• USB-C facing down</text>
<text x="34" y="508.6" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >  (towards the screw terminal)</text>
<text x="34" y="532.8" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >• Pins facing down</text>
<text x="34" y="557.0" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >• 5V/VBUS → bottom pin of J4</text>
<text x="34" y="581.2" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >• 3V3 → bottom pin of J3</text>
<text x="34" y="605.4" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >• EN top left, TX top right</text>
<text x="34" y="629.6" font-size="14" fill="#222" font-weight="normal" text-anchor="start" ></text>
<text x="34" y="653.8" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >Wrong if 5V is at the top!</text>
<line x1="262" y1="530" x2="350" y2="530" stroke="#1d4ed8" stroke-width="2" marker-end="url(#mb)"/>
<rect x="1071" y="130" width="308" height="290" rx="9" fill="#f9fafb" stroke="#7b2fd0" stroke-width="2.5"/>
<text x="1084" y="158" font-size="17" fill="#7b2fd0" font-weight="bold" text-anchor="start" >ADS1115 module</text>
<text x="1084" y="186.0" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >Plugs into J1</text>
<text x="1084" y="210.2" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >• Chip facing up, pins facing down</text>
<text x="1084" y="234.4" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >• VDD in pin 1 (top, square pad),</text>
<text x="1084" y="258.6" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >  A3 at the bottom</text>
<text x="1084" y="282.8" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >• Module sits to the right, inside</text>
<text x="1084" y="307.0" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >  the "ADS1115" frame</text>
<text x="1084" y="331.2" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >• A0 = sensor input</text>
<text x="1084" y="355.4" font-size="14" fill="#222" font-weight="normal" text-anchor="start" ></text>
<text x="1084" y="379.6" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >If it sticks out to the left over the</text>
<text x="1084" y="403.79999999999995" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >C3 mini: it is turned around!</text>
<line x1="1071" y1="260" x2="856" y2="260" stroke="#7b2fd0" stroke-width="2" marker-end="url(#mp)"/>
<rect x="1071" y="450" width="308" height="250" rx="9" fill="#f9fafb" stroke="#b91c1c" stroke-width="2.5"/>
<text x="1084" y="478" font-size="17" fill="#b91c1c" font-weight="bold" text-anchor="start" >Depth sensor (4–20 mA)</text>
<text x="1084" y="506.0" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >Screw terminal J2</text>
<text x="1084" y="530.2" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >• Terminal 1 (left) = RED</text>
<text x="1084" y="554.4" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >  +24 V from the converter</text>
<text x="1084" y="578.6" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >• Terminal 2 (right) = BLACK</text>
<text x="1084" y="602.8" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >  signal → shunt 75 Ω → A0</text>
<text x="1084" y="627.0" font-size="14" fill="#222" font-weight="normal" text-anchor="start" ></text>
<text x="1084" y="651.2" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >Empty: approx. 4 mA = 0.30 V</text>
<text x="1084" y="675.4" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >Full: 20 mA = 1.50 V</text>
<line x1="1071" y1="580" x2="960" y2="640" stroke="#b91c1c" stroke-width="2" marker-end="url(#mr)"/>
<rect x="21" y="791" width="604" height="190" rx="9" fill="#fdf6e3" stroke="#e8a317" stroke-width="2.5"/>
<text x="34" y="819" font-size="17" fill="#8a3b00" font-weight="bold" text-anchor="start" >Before first power-up</text>
<text x="34" y="850.0" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >1. Without modules: check 5V–GND and 24V–GND for shorts</text>
<text x="34" y="876.3" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >2. Plug in the C3 mini only, connect USB: J4 bottom pin to GND ≈ 4.7–5 V,</text>
<text x="34" y="902.6" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >    J1 pin 1 (VDD) to GND ≈ 3.3 V, J2 terminal 1 to GND ≈ 22–28 V</text>
<text x="34" y="928.9" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >3. Disconnect USB, plug in the ADS1115, connect the sensor, reconnect USB</text>
<text x="34" y="955.2" font-size="14" fill="#222" font-weight="normal" text-anchor="start" >4. Serial monitor: approx. 4 mA with the sensor empty</text>
</svg>
